[project]
name = "weather-report-buddy"
version = "0.1.0"
description = "指定エリアの雨雲レーダー(今後60分)を分析して外出アドバイスをくれる AI エージェント"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38.0",
    "langgraph>=0.3.21",
    "langchain-openai>=0.3.11",
    "langchain-core>=0.3.49",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "httpx>=0.27.0",
    "ddgs>=9.0.0",
    "python-dotenv>=1.0.1",
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[tool.ruff.lint]
# ruff の既定に任せず明示する。既定のルール集合は版を追うごとに広がっており
# （0.16 は旧版が見なかった UP / BLE / DTZ を指摘する）、明示しないとコードを
# 1行も変えずに ruff の更新だけで CI が落ちる。CI で uv を exact version に
# 固定しているのと同じ理由。
#
# BLE（except Exception のように全例外を捕まえる書き方）は選ばない。この repo の
# 2箇所はどちらも「ここで止めない」と決めた境界で、どう degrade させるかは
# 設計判断のため。なお、クラスを書かない except: は E7 の E722 が拾うので
# 無検査にはならない。
select = ["E4", "E7", "E9", "F", "UP", "DTZ"]

[tool.uv]
# 公開から7日未満のリリースを解決候補から外す（悪意ある新リリースへの対策）。
# 出たばかりの版を意図的に入れたいときは:
#   uv lock --exclude-newer-package <name>=<date>
exclude-newer = "7 days"
